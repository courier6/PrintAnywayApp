name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The build job (which runs npm ci, and with it the dependencies' install scripts)
# only reads the repo; publishing rights belong to the deploy job alone.
permissions:
  contents: read

# A deploy in progress finishes; a newer push waits for it rather than cutting
# GitHub Pages off mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's lastmod dates come from git log.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
