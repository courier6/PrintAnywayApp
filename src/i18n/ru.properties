# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = Принтеры HP могут блокировать печать, если какой-то картридж считается пустым. В приложении HP Smart выберите для чёрного картриджа «игнорировать» или найдите резервный режим печати.
tips.epson = Удерживайте кнопку Стоп/Отмена (Stop/Cancel), пока горит индикатор чернил, чтобы печатать в резервном режиме (зависит от модели).
tips.canon = Удерживайте кнопку Стоп (Stop) не менее 5 секунд, чтобы отключить проверку уровня чернил.

# Errors
error.tryAgain = Повторить
error.chooseDifferent = Выбрать другой файл
error.code = Код ошибки {code}
error.unsupported.title = Этот тип файлов пока не поддерживается.
error.unsupported.body = PrintAnyway App работает с PDF, PNG, JPG и HEIC (фото с iPhone).
error.office.title = Сначала этот файл нужно сохранить как PDF.
error.office.body = Откройте его в программе, в которой он создан, выберите «Файл → Сохранить как PDF» (или «Печать → Сохранить как PDF»), а затем выберите этот PDF здесь.
error.password.title = Этот PDF защищён паролем.
error.password.body = Откройте его в программе для просмотра PDF, выберите «Печать → Сохранить как PDF», чтобы создать незащищённую копию, и перетащите её сюда.
error.damaged-pdf.title = Не удалось прочитать этот PDF.
error.damaged-pdf.body = Возможно, файл неполный или повреждён. Попробуйте скачать или экспортировать его заново.
error.heic.title = Не удалось преобразовать это фото.
error.heic.body = Возможно, файл HEIC повреждён. Сделайте снимок экрана с фото или экспортируйте его в JPG, а затем откройте получившийся файл.
error.image.title = Не удалось прочитать это изображение.
error.image.body = Возможно, файл повреждён. Экспортируйте или сохраните изображение заново и попробуйте ещё раз.
error.memory.title = Файл слишком большой для этого устройства.
error.memory.body = Закройте другие вкладки или попробуйте файл поменьше — для больших страниц нужно больше памяти, чем смог выделить браузер.
error.old-browser.title = Этот браузер слишком старый, чтобы открывать PDF.
error.old-browser.body = Обновите браузер или откройте эту страницу в более новом. Файлы PNG и JPG здесь по-прежнему работают.
error.processing.title = Что-то пошло не так при перекрашивании.
error.processing.body = Обычно это временно — попробуйте тот же файл ещё раз или выберите другой.
