# Russian UI strings. Translated from en.properties; see GLOSSARY.md.
# preview.pages: one = 1, 21, 31…; few = 2–4, 22–24…; many = 5–20, 25–30…; other = fractions.

# Page head (title, search and share previews)
meta.title = Печать без чёрных чернил — бесплатно, в браузере | PrintAnyway App
meta.description = Принтер не печатает, потому что закончились чёрные чернила? PrintAnyway App перекрашивает ваш PDF или фото в тёмный цвет, который принтер ещё может напечатать. Бесплатно и конфиденциально — файлы не покидают браузер.
og.title = Печать без чёрных чернил — бесплатно, в браузере
og.description = PrintAnyway App перекрашивает ваш PDF или фото в тёмный цвет, который ваш принтер ещё может напечатать. Бесплатно и конфиденциально — файлы не покидают браузер.
og.imageAlt = PrintAnyway App: страница, напечатанная чёрными чернилами, рядом с той же страницей, перекрашенной в тёмно-синий.
jsonld.description = Перекрашивает PDF и фото в тёмный цвет, который принтер может напечатать без чёрных чернил. Работает полностью в браузере; файлы никуда не загружаются.

