empty.formats = PDF, PNG, JPG или HEIC
empty.noscript = Чтобы открыть файл, PrintAnyway App нужен JavaScript.
empty.privacy = Файлы перекрашиваются в браузере. Ничего не покидает ваше устройство.
empty.tipsLead = Для HP, Epson, Canon и большинства других цветных принтеров ·
empty.tipsLink = Принтер всё ещё отказывается печатать? Смотрите советы

