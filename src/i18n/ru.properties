# Print reminder
printReminder.lead = Перед печатью:
printReminder.body = в окне печати убедитесь, что выбран режим {color}, а не «Оттенки серого» или «Чёрно-белый».
printReminder.color = Цветной
printReminder.dismiss = Понятно

