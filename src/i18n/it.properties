# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = Le stampanti HP possono bloccare la stampa quando una qualsiasi cartuccia risulta vuota. Nell’app HP Smart, imposta la cartuccia nera su «ignora» oppure cerca la modalità backup dell’inchiostro.
tips.epson = Per stampare in modalità di riserva, tieni premuto Stop/Annulla (Stop/Cancel) mentre la spia dell’inchiostro è accesa (dipende dal modello).
tips.canon = Tieni premuto Stop almeno 5 secondi per disattivare il controllo del livello d’inchiostro.

# Errors
error.tryAgain = Riprova
error.chooseDifferent = Scegli un altro file
error.code = Codice errore {code}
error.unsupported.title = Questo tipo di file non è ancora supportato.
error.unsupported.body = PrintAnyway App funziona con PDF, PNG, JPG e HEIC (foto di iPhone).
error.password.title = Questo PDF è protetto da password.
error.password.body = Aprilo nel tuo lettore PDF, usa «Stampa → Salva come PDF» per creare una copia sbloccata, poi trascinala qui.
error.damaged-pdf.title = Impossibile leggere questo PDF.
error.damaged-pdf.body = Il file potrebbe essere incompleto o danneggiato. Prova a scaricarlo o a esportarlo di nuovo.
error.heic.title = Impossibile convertire questa foto.
error.heic.body = Il file HEIC potrebbe essere danneggiato. Fai uno screenshot della foto o esportala in JPG, poi riprova con quel file.
error.image.title = Impossibile leggere questa immagine.
error.image.body = Il file potrebbe essere danneggiato. Esporta o salva di nuovo l’immagine e riprova.
error.memory.title = Questo file è troppo grande per questo dispositivo.
error.memory.body = Chiudi altre schede o prova un file più piccolo — le pagine grandi richiedono più memoria di quella che il browser è riuscito a fornire.
error.processing.title = Qualcosa è andato storto durante la ricolorazione.
error.processing.body = Di solito è temporaneo — riprova con lo stesso file o scegline un altro.
