empty.noscript = PrintAnyway App ha bisogno di JavaScript per aprire il tuo file.
empty.privacy = I file vengono ricolorati nel tuo browser. Nulla lascia il tuo dispositivo.
empty.tipsLead = Per HP, Epson, Canon e la maggior parte delle altre stampanti a colori ·
empty.tipsLink = La stampante non stampa ancora? Leggi i consigli

