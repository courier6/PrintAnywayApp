# Italian UI strings. Translated from en.properties; see GLOSSARY.md.

# Page head (title, search and share previews)
meta.title = Stampa senza inchiostro nero — gratis, nel tuo browser | PrintAnyway App
meta.description = La stampante non stampa perché l’inchiostro nero è finito? PrintAnyway App ricolora il tuo PDF o la tua foto in un colore scuro che la stampante può ancora stampare. Gratis e privato: i file non lasciano mai il tuo browser.
og.title = Stampa senza inchiostro nero — gratis, nel tuo browser
og.description = PrintAnyway App ricolora il tuo PDF o la tua foto in un colore scuro che la tua stampante può ancora stampare. Gratis e privato: i file non lasciano mai il tuo browser.
og.imageAlt = PrintAnyway App: una pagina stampata con inchiostro nero accanto alla stessa pagina ricolorata in blu notte.
jsonld.description = Ricolora PDF e foto in un colore scuro che la tua stampante può stampare senza inchiostro nero. Funziona interamente nel browser; i file non vengono mai caricati.

