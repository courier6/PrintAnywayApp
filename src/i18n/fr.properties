# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = Les imprimantes HP peuvent bloquer l’impression dès qu’une cartouche est signalée vide. Dans l’app HP Smart, réglez la cartouche noire sur « ignorer » ou cherchez le mode cartouche unique.
tips.epson = Pour imprimer en mode de réserve, maintenez le bouton Arrêt/Annuler (Stop/Cancel) enfoncé pendant que le voyant d’encre est allumé (selon le modèle).
tips.canon = Maintenez le bouton Arrêt (Stop) enfoncé pendant au moins 5 secondes pour désactiver la détection du niveau d’encre.

# Errors
error.tryAgain = Réessayer
error.chooseDifferent = Choisir un autre fichier
error.code = Code d’erreur {code}
error.unsupported.title = Ce type de fichier n’est pas encore pris en charge.
error.unsupported.body = PrintAnyway App fonctionne avec les PDF, PNG, JPG et HEIC (photos d’iPhone).
error.password.title = Ce PDF est protégé par un mot de passe.
error.password.body = Ouvrez-le dans votre lecteur PDF, utilisez « Imprimer → Enregistrer au format PDF » pour créer une copie déverrouillée, puis déposez cette copie ici.
error.damaged-pdf.title = Impossible de lire ce PDF.
error.damaged-pdf.body = Le fichier est peut-être incomplet ou endommagé. Essayez de le télécharger ou de l’exporter à nouveau.
error.heic.title = Impossible de convertir cette photo.
error.heic.body = Le fichier HEIC est peut-être endommagé. Faites une capture d’écran de la photo ou exportez-la en JPG, puis réessayez avec ce nouveau fichier.
error.image.title = Impossible de lire cette image.
error.image.body = Le fichier est peut-être endommagé. Exportez ou enregistrez de nouveau l’image, puis réessayez.
error.memory.title = Ce fichier est trop volumineux pour cet appareil.
error.memory.body = Fermez d’autres onglets ou essayez un fichier plus petit : les grandes pages demandent plus de mémoire que le navigateur n’a pu en fournir.
error.processing.title = Un problème est survenu pendant la recoloration.
error.processing.body = C’est généralement temporaire : réessayez avec le même fichier ou choisissez-en un autre.
