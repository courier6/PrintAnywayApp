# French UI strings. Translated from en.properties; see GLOSSARY.md.
# Spaces before ? ! : ; and inside « » are no-break spaces (U+00A0).

# Page head (title, search and share previews)
meta.title = Imprimer sans encre noire — gratuit, dans votre navigateur | PrintAnyway App
meta.description = Votre imprimante refuse d’imprimer parce qu’il n’y a plus d’encre noire ? PrintAnyway App recolore votre PDF ou votre photo dans une couleur foncée que votre imprimante peut encore imprimer. Gratuit et confidentiel : vos fichiers ne quittent jamais votre navigateur.
og.title = Imprimer sans encre noire — gratuit, dans votre navigateur
og.description = PrintAnyway App recolore votre PDF ou votre photo dans une couleur foncée que votre imprimante peut encore imprimer. Gratuit et confidentiel : vos fichiers ne quittent jamais votre navigateur.
og.imageAlt = PrintAnyway App : une page imprimée à l’encre noire à côté de la même page recolorée en bleu marine.
jsonld.description = Recolore les PDF et les photos dans une couleur foncée que votre imprimante peut imprimer sans encre noire. Tout se passe dans le navigateur ; les fichiers ne sont jamais mis en ligne.

