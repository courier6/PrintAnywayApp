# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = Impressoras HP podem bloquear a impressão quando algum cartucho aparece como vazio. No app HP Smart, escolha ignorar o cartucho preto ou procure o modo de reserva de tinta.
tips.epson = Para imprimir no modo de reserva, mantenha pressionado o botão Parar/Cancelar (Stop/Cancel) enquanto a luz de tinta estiver acesa (varia conforme o modelo).
tips.canon = Mantenha pressionado o botão Parar (Stop) por pelo menos 5 segundos para desativar a verificação do nível de tinta.

# Errors
error.tryAgain = Tentar novamente
error.chooseDifferent = Escolher outro arquivo
error.code = Código de erro {code}
error.unsupported.title = Este tipo de arquivo ainda não é compatível.
error.unsupported.body = O PrintAnyway App funciona com PDF, PNG, JPG e HEIC (fotos do iPhone).
error.password.title = Este PDF está protegido por senha.
error.password.body = Abra o arquivo no seu leitor de PDF, use “Imprimir → Salvar como PDF” para criar uma cópia sem senha. Depois, arraste essa cópia para cá.
error.damaged-pdf.title = Não foi possível ler este PDF.
error.damaged-pdf.body = O arquivo pode estar incompleto ou danificado. Tente baixá-lo ou exportá-lo novamente.
error.heic.title = Não foi possível converter esta foto.
error.heic.body = O arquivo HEIC pode estar danificado. Faça uma captura de tela da foto ou exporte-a como JPG e tente com esse arquivo.
error.image.title = Não foi possível ler esta imagem.
error.image.body = O arquivo pode estar danificado. Exporte ou salve a imagem novamente e tente outra vez.
error.memory.title = Este arquivo é grande demais para este dispositivo.
error.memory.body = Feche outras abas ou tente um arquivo menor: páginas grandes precisam de mais memória do que o navegador conseguiu oferecer.
error.processing.title = Algo deu errado ao recolorir o arquivo.
error.processing.body = Costuma ser temporário: tente o mesmo arquivo de novo ou escolha outro.
