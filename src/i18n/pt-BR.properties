# Brazilian Portuguese UI strings. Translated from en.properties; see GLOSSARY.md.

# Page head (title, search and share previews)
meta.title = Imprima sem tinta preta — grátis, no seu navegador | PrintAnyway App
meta.description = Sua impressora não imprime porque a tinta preta acabou? O PrintAnyway App recolore seu PDF ou sua foto em uma cor escura que a impressora ainda consegue imprimir. Grátis e privado: seus arquivos nunca saem do navegador.
og.title = Imprima sem tinta preta — grátis, no seu navegador
og.description = O PrintAnyway App recolore seu PDF ou sua foto em uma cor escura que sua impressora ainda consegue imprimir. Grátis e privado: seus arquivos nunca saem do navegador.
og.imageAlt = PrintAnyway App: uma página impressa com tinta preta ao lado da mesma página recolorida em azul-marinho.
jsonld.description = Recolore PDFs e fotos em uma cor escura que sua impressora consegue imprimir sem tinta preta. Funciona inteiramente no navegador; os arquivos nunca são enviados.

