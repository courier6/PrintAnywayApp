# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = Las impresoras HP pueden bloquear la impresión si algún cartucho aparece vacío. En la app HP Smart, ajusta el cartucho negro a “ignorar” o busca el modo de reserva de tinta.
tips.epson = Para imprimir en modo de reserva, mantén presionado el botón Detener/Cancelar (Stop/Cancel) mientras la luz de tinta esté encendida (varía según el modelo).
tips.canon = Mantén presionado el botón Parar (Stop) durante 5 segundos o más para desactivar la comprobación del nivel de tinta.

# Errors
error.tryAgain = Intentar de nuevo
error.chooseDifferent = Elegir otro archivo
error.code = Código de error {code}
error.unsupported.title = Este tipo de archivo aún no es compatible.
error.unsupported.body = PrintAnyway App funciona con PDF, PNG, JPG y HEIC (fotos de iPhone).
error.password.title = Este PDF está protegido con contraseña.
error.password.body = Ábrelo en tu visor de PDF, usa “Imprimir → Guardar como PDF” para crear una copia desbloqueada y luego arrastra esa copia aquí.
error.damaged-pdf.title = No se pudo leer este PDF.
error.damaged-pdf.body = Puede que el archivo esté incompleto o dañado. Intenta descargarlo o exportarlo de nuevo.
error.heic.title = No se pudo convertir esta foto.
error.heic.body = Puede que el archivo HEIC esté dañado. Haz una captura de pantalla de la foto o expórtala como JPG y prueba con ese archivo.
error.image.title = No se pudo leer esta imagen.
error.image.body = Puede que el archivo esté dañado. Exporta o guarda la imagen otra vez y vuelve a intentarlo.
error.memory.title = Este archivo es demasiado grande para este dispositivo.
error.memory.body = Cierra otras pestañas o prueba con un archivo más pequeño: las páginas grandes necesitan más memoria de la que el navegador pudo ofrecer.
error.processing.title = Algo salió mal al recolorear el archivo.
error.processing.body = Suele ser temporal: vuelve a probar con el mismo archivo o elige otro.
