# Spanish UI strings. Translated from en.properties; see GLOSSARY.md.

# Page head (title, search and share previews)
meta.title = Imprime sin tinta negra — gratis, en tu navegador | PrintAnyway App
meta.description = ¿Tu impresora no imprime porque se acabó la tinta negra? PrintAnyway App recolorea tu PDF o foto en un color oscuro que tu impresora aún puede imprimir. Gratis y privado: tus archivos nunca salen de tu navegador.
og.title = Imprime sin tinta negra — gratis, en tu navegador
og.description = PrintAnyway App recolorea tu PDF o foto en un color oscuro que tu impresora aún puede imprimir. Gratis y privado: tus archivos nunca salen de tu navegador.
og.imageAlt = PrintAnyway App: una página impresa con tinta negra junto a la misma página recoloreada en azul marino.
jsonld.description = Recolorea PDF y fotos en un color oscuro que tu impresora puede imprimir sin tinta negra. Funciona completamente en el navegador; los archivos nunca se suben.

