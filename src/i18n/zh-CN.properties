meta.title = 没有黑色墨水也能打印——免费，在浏览器中完成 | PrintAnyway App
meta.description = 黑色墨水用完了，打印机不肯打印？PrintAnyway App 会把你的 PDF 或照片重新着色为打印机仍能打印的深色。免费且私密——文件绝不会离开你的浏览器。
