# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = 只要有一个墨盒显示为空，HP 打印机就可能停止打印。在 HP Smart 应用中将黑色墨盒设为“忽略”，或查找墨水备份模式。
tips.epson = 在墨水指示灯亮起时按住停止/取消（Stop/Cancel）按钮，即可在备份模式下打印（因型号而异）。
tips.canon = 按住停止（Stop）按钮 5 秒以上，即可关闭墨水余量检测。

# Errors
error.tryAgain = 重试
error.chooseDifferent = 选择其他文件
