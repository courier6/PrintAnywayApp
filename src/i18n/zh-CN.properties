error.unsupported.body = PrintAnyway App 支持 PDF、PNG、JPG 和 HEIC（iPhone 照片）。
error.password.title = 此 PDF 受密码保护。
error.password.body = 在 PDF 阅读器中打开它，使用“打印 → 另存为 PDF”生成一份未加密的副本，然后把副本拖到这里。
error.damaged-pdf.title = 无法读取此 PDF。
error.damaged-pdf.body = 文件可能不完整或已损坏。请尝试重新下载或重新导出。
error.heic.title = 无法转换这张照片。
error.heic.body = HEIC 文件可能已损坏。请给照片截个屏，或将其导出为 JPG，然后改用该文件。
error.image.title = 无法读取此图片。
error.image.body = 文件可能已损坏。请重新导出或重新保存图片，然后再试一次。
error.memory.title = 此文件对这台设备来说太大了。
error.memory.body = 请关闭其他标签页或尝试较小的文件——页面较大时，所需内存超出了浏览器能提供的范围。
error.processing.title = 重新着色时出了点问题。
error.processing.body = 这通常是暂时的——请用同一个文件再试一次，或选择其他文件。
