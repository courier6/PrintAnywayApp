# Japanese UI strings. Translated from en.properties; see GLOSSARY.md.
# Japanese has a single plural form, so preview.pages has only .other.

# Page head (title, search and share previews)
meta.title = 黒インクなしで印刷 — 無料、ブラウザだけで完結 | PrintAnyway App
meta.description = 黒インクが切れてプリンターが印刷しない？PrintAnyway Appなら、PDFや写真を、プリンターがまだ印刷できる濃い色に変換します。無料でプライバシーも安心。ファイルがブラウザの外に出ることはありません。
og.title = 黒インクなしで印刷 — 無料、ブラウザだけで完結
og.description = PrintAnyway Appは、PDFや写真を、プリンターがまだ印刷できる濃い色に変換します。無料でプライバシーも安心。ファイルがブラウザの外に出ることはありません。
og.imageAlt = PrintAnyway App：黒インクで印刷したページと、同じページを濃紺に色変換したもの。
jsonld.description = PDFや写真を、黒インクなしでもプリンターが印刷できる濃い色に変換します。すべてブラウザ内で動作し、ファイルがアップロードされることはありません。

