# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = HPのプリンターは、いずれかのカートリッジが空と表示されると印刷を止めることがあります。HP Smartアプリで黒カートリッジを「無視」に設定するか、インクバックアップモードを探してください。
tips.epson = インクランプが点灯している間にストップ/キャンセル（Stop/Cancel）ボタンを長押しすると、バックアップモードで印刷できます（機種により異なります）。
tips.canon = ストップ（Stop）ボタンを5秒以上長押しすると、インク残量の検知を無効にできます。

# Errors
error.tryAgain = もう一度試す
error.chooseDifferent = 別のファイルを選択
error.code = エラーコード {code}
error.unsupported.title = この形式のファイルにはまだ対応していません。
error.unsupported.body = PrintAnyway Appは、PDF、PNG、JPG、HEIC（iPhoneの写真）に対応しています。
error.password.title = このPDFはパスワードで保護されています。
error.password.body = PDFビューアで開き、「印刷 → PDFとして保存」でロックのないコピーを作成してから、そのコピーをここにドロップしてください。
error.damaged-pdf.title = このPDFを読み込めませんでした。
error.damaged-pdf.body = ファイルが不完全か、破損している可能性があります。もう一度ダウンロードするか、書き出し直してください。
error.heic.title = この写真を変換できませんでした。
error.heic.body = HEICファイルが破損している可能性があります。写真のスクリーンショットを撮るか、JPGで書き出して、そちらでお試しください。
error.image.title = この画像を読み込めませんでした。
error.image.body = ファイルが破損している可能性があります。画像を書き出し直すか保存し直して、もう一度お試しください。
error.memory.title = このファイルは、このデバイスで処理するには大きすぎます。
error.memory.body = 他のタブを閉じるか、小さいファイルでお試しください。大きなページには、ブラウザが確保できる以上のメモリが必要です。
error.processing.title = 色変換中に問題が発生しました。
error.processing.body = たいていは一時的な問題です。同じファイルでもう一度試すか、別のファイルを選んでください。
