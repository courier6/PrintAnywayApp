# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = HP printers may block printing when any cartridge reads empty. In the HP Smart app, set the black cartridge to “ignore,” or look for ink backup mode.
tips.epson = Press and hold Stop/Cancel while the ink light is on to print in backup mode (varies by model).
tips.canon = Press and hold Stop for 5+ seconds to disable the ink level check.

# Errors
error.tryAgain = Try again
error.chooseDifferent = Choose a different file
error.code = Error code {code}
error.unsupported.title = This file type isn't supported yet.
error.unsupported.body = PrintAnyway App works with PDF, PNG, JPG, and HEIC (iPhone photos).
error.password.title = This PDF is password-protected.
error.password.body = Open it in your PDF viewer, use "Print → Save as PDF" to make an unlocked copy, then drop that here.
error.damaged-pdf.title = This PDF couldn't be read.
error.damaged-pdf.body = The file may be incomplete or damaged. Try re-downloading or re-exporting it.
error.heic.title = This photo couldn't be converted.
error.heic.body = The HEIC file may be damaged. Screenshot the photo, or export it as JPG, and try that instead.
error.image.title = This image couldn't be read.
error.image.body = The file may be damaged. Re-export or re-save the image and try again.
error.memory.title = This file is too large for this device.
error.memory.body = Close other tabs or try a smaller file — big page sizes need more memory than the browser could give.
error.processing.title = Something went wrong while recoloring.
error.processing.body = It's usually temporary — try the same file again, or choose a different one.
