# English UI strings: the source of truth for every <code>.properties file in this
# folder. Each translation must have exactly these keys and the same {placeholders};
# the build fails otherwise. Loaded by the properties plugin in vite.config.ts.
#
# Format:
# - key = value, one per line. Lines starting with # are comments; blank lines are ignored.
# - The line is split on the first "="; key and value are trimmed.
# - The file is UTF-8: write —, ’ and … literally. No \uXXXX escapes, no line continuations.
# - Placeholders are {name}. Plurals use .one / .other suffixes.
# - index.html pulls landing-page strings in at build time with {{t:key}} tokens.

# Page head (title, search and share previews)
meta.title = Print Without Black Ink — Free, in Your Browser | PrintAnyway App
meta.description = Printer won't print because the black ink is out? PrintAnyway App recolors your PDF or photo in a dark color it can still print. Free and private — files never leave your browser.
og.title = Print Without Black Ink — Free, in Your Browser
og.description = PrintAnyway App recolors your PDF or photo in a dark color your printer can still print. Free and private — files never leave your browser.
og.imageAlt = PrintAnyway App: a page printed in black ink next to the same page recolored in dark navy.
jsonld.description = Recolors PDFs and photos in a dark color your printer can print without black ink. Runs entirely in the browser; files are never uploaded.

