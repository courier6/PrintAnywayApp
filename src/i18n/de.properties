# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = HP-Drucker können das Drucken blockieren, sobald eine Patrone als leer gilt. Stellen Sie in der HP Smart App die schwarze Patrone auf „ignorieren“ oder suchen Sie nach dem Tintenreservemodus.
tips.epson = Um im Reservemodus zu drucken, halten Sie die Taste Stopp/Abbrechen (Stop/Cancel) gedrückt, während die Tintenanzeige leuchtet (je nach Modell).
tips.canon = Halten Sie die Stopp-Taste (Stop) mindestens 5 Sekunden lang gedrückt, um die Tintenstandsprüfung zu deaktivieren.

# Errors
error.tryAgain = Erneut versuchen
error.chooseDifferent = Andere Datei auswählen
error.code = Fehlercode {code}
error.unsupported.title = Dieser Dateityp wird noch nicht unterstützt.
error.unsupported.body = PrintAnyway App funktioniert mit PDF, PNG, JPG und HEIC (iPhone-Fotos).
error.password.title = Dieses PDF ist passwortgeschützt.
error.password.body = Öffnen Sie es in Ihrem PDF-Viewer, erstellen Sie mit „Drucken → Als PDF speichern“ eine entsperrte Kopie und ziehen Sie diese hierher.
error.damaged-pdf.title = Dieses PDF konnte nicht gelesen werden.
error.damaged-pdf.body = Die Datei ist möglicherweise unvollständig oder beschädigt. Laden Sie sie erneut herunter oder exportieren Sie sie neu.
error.heic.title = Dieses Foto konnte nicht umgewandelt werden.
error.heic.body = Die HEIC-Datei ist möglicherweise beschädigt. Machen Sie einen Screenshot des Fotos oder exportieren Sie es als JPG und verwenden Sie stattdessen diese Datei.
error.image.title = Dieses Bild konnte nicht gelesen werden.
error.image.body = Die Datei ist möglicherweise beschädigt. Exportieren oder speichern Sie das Bild neu und versuchen Sie es noch einmal.
error.memory.title = Diese Datei ist zu groß für dieses Gerät.
error.memory.body = Schließen Sie andere Tabs oder versuchen Sie es mit einer kleineren Datei – große Seitenformate benötigen mehr Speicher, als der Browser bereitstellen konnte.
error.processing.title = Beim Umfärben ist etwas schiefgelaufen.
error.processing.body = Das ist meist nur vorübergehend – versuchen Sie es mit derselben Datei noch einmal oder wählen Sie eine andere.
