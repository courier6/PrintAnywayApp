# Ink names
ink.navy = Marineblau
ink.teal = Petrolblau
ink.maroon = Weinrot
ink.purple = Dunkelviolett
ink.gold = Gold

# Printer tips (brand names stay in src/lib/printerTips.ts)
tips.hp = HP-Drucker können das Drucken blockieren, sobald eine Patrone als leer gilt. Stellen Sie in der HP Smart App die schwarze Patrone auf „ignorieren“ oder suchen Sie nach dem Einzelpatronenmodus.
tips.epson = Halten Sie Stopp/Abbrechen (Stop/Cancel) gedrückt, während die Tintenlampe leuchtet, um im Reservemodus zu drucken (je nach Modell).
tips.canon = Halten Sie Stopp (Stop) mindestens 5 Sekunden gedrückt, um die Tintenstandsprüfung abzuschalten.

# Errors
error.tryAgain = Erneut versuchen
error.chooseDifferent = Andere Datei auswählen
error.code = Fehlercode {code}
error.unsupported.title = Dieser Dateityp wird noch nicht unterstützt.
error.unsupported.body = PrintAnyway App funktioniert mit PDF, PNG, JPG und HEIC (iPhone-Fotos).
error.password.title = Dieses PDF ist passwortgeschützt.
error.password.body = Öffnen Sie es in Ihrem PDF-Viewer, erstellen Sie mit „Drucken → Als PDF speichern“ eine entsperrte Kopie und ziehen Sie diese hierher.
error.damaged-pdf.title = Dieses PDF lässt sich nicht lesen.
error.damaged-pdf.body = Die Datei ist womöglich unvollständig oder beschädigt. Laden Sie die Datei neu herunter oder exportieren Sie sie erneut.
error.heic.title = Dieses Foto konnte nicht umgewandelt werden.
error.heic.body = Die HEIC-Datei ist möglicherweise beschädigt. Machen Sie einen Screenshot des Fotos oder exportieren Sie es als JPG und versuchen Sie es damit.
error.image.title = Dieses Bild lässt sich nicht lesen.
error.image.body = Die Datei ist womöglich beschädigt. Speichern oder exportieren Sie das Bild neu und versuchen Sie es erneut.
error.memory.title = Diese Datei ist zu groß für dieses Gerät.
error.memory.body = Schließen Sie andere Tabs oder versuchen Sie eine kleinere Datei – große Seitenformate brauchen mehr Speicher, als der Browser freigeben konnte.
error.processing.title = Beim Umfärben ist etwas schiefgelaufen.
error.processing.body = Meist nur vorübergehend – versuchen Sie dieselbe Datei noch einmal oder wählen Sie eine andere.
