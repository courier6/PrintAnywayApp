# German UI strings. Translated from en.properties; see GLOSSARY.md.

# Page head (title, search and share previews)
meta.title = Drucken ohne schwarze Tinte – kostenlos im Browser | PrintAnyway App
meta.description = Ihr Drucker druckt nicht, weil die schwarze Tinte leer ist? PrintAnyway App färbt Ihr PDF oder Foto in eine dunkle Farbe um, die Ihr Drucker noch drucken kann. Kostenlos und privat: Ihre Dateien verlassen nie Ihren Browser.
og.title = Drucken ohne schwarze Tinte – kostenlos im Browser
og.description = PrintAnyway App färbt Ihr PDF oder Foto in eine dunkle Farbe um, die Ihr Drucker noch drucken kann. Kostenlos und privat: Ihre Dateien verlassen nie Ihren Browser.
og.imageAlt = PrintAnyway App: eine mit schwarzer Tinte gedruckte Seite neben derselben Seite in Marineblau.
jsonld.description = Färbt PDFs und Fotos in eine dunkle Farbe um, die Ihr Drucker ohne schwarze Tinte drucken kann. Läuft komplett im Browser; Dateien werden nie hochgeladen.

