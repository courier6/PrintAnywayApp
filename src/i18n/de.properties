empty.subline = Wir machen aus Schwarz ein dunkles Blau, damit Ihr Drucker weiterdrucken kann.
empty.choose = Datei auswählen
empty.formats = PDF, PNG, JPG oder HEIC
empty.noscript = PrintAnyway App benötigt JavaScript, um Ihre Datei zu öffnen.
empty.privacy = Dateien werden in Ihrem Browser umgefärbt. Nichts verlässt Ihr Gerät.
empty.tipsLead = Für HP, Epson, Canon und die meisten anderen Farbdrucker ·
empty.tipsLink = Drucker streikt weiter? Tipps ansehen

